name = "nayaspend-backend"
main = "src/index.ts"
compatibility_date = "2025-02-04"

[[d1_databases]]
binding = "DB"
database_name = "nayaspend"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Capture Scheduler retry queue: on a Gmail API failure, a retry message
# is enqueued with a delaySeconds of 60/300/900 (1/5/15 min) instead of
# an in-process sleep, since a single Worker invocation has a bounded
# execution time. See backend/src/services/captureScheduler.ts.
[[queues.producers]]
queue = "capture-retry"
binding = "CAPTURE_RETRY_QUEUE"

[[queues.consumers]]
queue = "capture-retry"
max_batch_size = 1
# The retry chain is already app-level (captureScheduler.ts's own
# queue.send calls with explicit 60/300/900s backoff). max_retries = 0
# so Cloudflare's own platform-level redelivery can't stack a second,
# uncoordinated retry chain on top of that one.
max_retries = 0

# Three Cron Triggers, dispatched in src/index.ts's scheduled() handler
# to their real implementations: captureScheduler (hourly), watchdog
# (hourly, offset 30 min). The third (every 6 hours) is still an
# intentional no-op until Phase 7 builds budget/bill evaluation.
[triggers]
crons = [
  "0 * * * *",    # hourly: Capture Scheduler
  "30 * * * *",   # hourly, offset 30 min: Watchdog
  "0 */6 * * *",  # every 6 hours: budget/bill evaluation
]
