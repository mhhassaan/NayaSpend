name = "nayaspend-backend"
main = "src/index.ts"
compatibility_date = "2025-02-04"

# Served at https://api.nayaspend.app (the domain must be a Cloudflare zone).
routes = [{ pattern = "api.nayaspend.app", custom_domain = true }]

# Non-secret production config. Secrets are set with `wrangler secret put`:
# GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, RESEND_API_KEY, TOKEN_ENCRYPTION_KEY,
# NOTIFICATION_EMAIL, DEEPSEEK_API_KEY (optional). See docs/DEPLOY.md.
[vars]
FRONTEND_BASE_URL = "https://nayaspend.app"
GMAIL_REDIRECT_URI = "https://api.nayaspend.app/auth/gmail/callback"
DEEPSEEK_MODEL = "deepseek-flash"

[[d1_databases]]
binding = "DB"
database_name = "nayaspend"
database_id = "7c683cc8-ebe2-471f-8ffe-9a53393661c0"

# Capture Scheduler retry queue: on a Gmail API failure, a retry message
# is enqueued with a delaySeconds of 60/300/900 (1/5/15 min) instead of
# an in-process sleep, since a single Worker invocation has a bounded
# execution time. See backend/src/services/captureScheduler.ts.
[[queues.producers]]
queue = "capture-retry"
binding = "CAPTURE_RETRY_QUEUE"

[[queues.consumers]]
queue = "capture-retry"
max_batch_size = 1
# The retry chain is already app-level (captureScheduler.ts's own
# queue.send calls with explicit 60/300/900s backoff). max_retries = 0
# so Cloudflare's own platform-level redelivery can't stack a second,
# uncoordinated retry chain on top of that one.
max_retries = 0

# Three Cron Triggers, dispatched in src/index.ts's scheduled() handler
# to their real implementations: captureScheduler (hourly), watchdog
# (hourly, offset 30 min), and budgetAlertTrigger/billReminderTrigger
# (every 6 hours).
[triggers]
crons = [
  "0 * * * *",    # hourly: Capture Scheduler
  "30 * * * *",   # hourly, offset 30 min: Watchdog
  "0 */6 * * *",  # every 6 hours: budget/bill evaluation
]

# ---------------------------------------------------------------------------
# Dev environment (deployed from the `dev` branch): its own Worker, D1 database,
# queue and domain, so test data never touches production. Environments do not
# inherit bindings, so everything is repeated. Deploy with `wrangler deploy --env dev`.
# Secrets are separate too (`wrangler secret put NAME --env dev`).
# ---------------------------------------------------------------------------
[env.dev]
name = "nayaspend-backend-dev"
routes = [{ pattern = "api-dev.nayaspend.app", custom_domain = true }]

[env.dev.vars]
FRONTEND_BASE_URL = "https://dev.nayaspend.app"
GMAIL_REDIRECT_URI = "https://api-dev.nayaspend.app/auth/gmail/callback"
DEEPSEEK_MODEL = "deepseek-flash"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nayaspend-dev"
database_id = "63d7c0d0-2622-4839-8460-61d2f27bc292"

[[env.dev.queues.producers]]
queue = "capture-retry-dev"
binding = "CAPTURE_RETRY_QUEUE"

[[env.dev.queues.consumers]]
queue = "capture-retry-dev"
max_batch_size = 1
max_retries = 0

# Free plan allows 5 cron triggers per account and production uses 3, so dev
# runs capture (hourly) and the budget/bill evaluation (6-hourly) but not the watchdog.
[env.dev.triggers]
crons = [
  "0 * * * *",
  "0 */6 * * *",
]
